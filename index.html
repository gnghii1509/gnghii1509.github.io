
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Phan Ngọc Thanh Thảo 💙</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #020412;
  overflow: hidden;
  height: 100vh;
  font-family: Arial, sans-serif;
}

canvas {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
}

.message {
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #d9edff;
  font-size: 24px;
  font-weight: bold;
  text-shadow: 0 0 8px #56aaff,
               0 0 20px #1479ff;
  pointer-events: none;
  animation: glow 2s ease-in-out infinite alternate;
}

@keyframes glow {
  from { opacity: .6; }
  to { opacity: 1; text-shadow: 0 0 25px #66baff; }
}

.footer {
  position: absolute;
  bottom: 25px;
  width: 100%;
  text-align: center;
  color: #8fa9d5;
  font-size: 13px;
  font-style: italic;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div class="message">Phan Ngọc Thanh Thảo</div>
<div class="footer">Nhấn vào màn hình ii có trái tim bay phấp phới ó cậu =))) 💙</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H, particles = [], stars = [];
let time = 0;

function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  createHeart();
  createStars();
}

function heart(t) {
  return {
    x: 16 * Math.pow(Math.sin(t), 3),
    y: -(13 * Math.cos(t)
      - 5 * Math.cos(2*t)
      - 2 * Math.cos(3*t)
      - Math.cos(4*t))
  };
}

class Particle {
  constructor(x, y, targetX, targetY) {
    this.x = x;
    this.y = y;
    this.tx = targetX;
    this.ty = targetY;
    this.size = Math.random() * 2.5 + .6;
    this.speed = Math.random() * .025 + .012;
    this.phase = Math.random() * Math.PI * 2;
    this.color = Math.random() > .2
      ? "80,160,255" : "190,210,255";
  }

  update() {
    this.x += (this.tx - this.x) * this.speed;
    this.y += (this.ty - this.y) * this.speed;
  }

  draw() {
    let glow = .45 + .55 *
      Math.abs(Math.sin(time * .025 + this.phase));

    ctx.beginPath();
    ctx.fillStyle = `rgba(${this.color},${glow})`;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#258cff";
    ctx.arc(this.x, this.y, this.size, 0, Math.PI*2);
    ctx.fill();
    ctx.shadowBlur = 0;
  }
}

function createHeart() {
  particles = [];
  const scale = Math.min(W / 45, H / 42, 13);
  const cx = W / 2;
  const cy = H * .44;

  for (let i = 0; i < 220; i++) {
    let t = Math.random() * Math.PI * 2;
    let p = heart(t);
    let scatter = .88 + Math.random() * .24;

    let x = cx + p.x * scale * scatter;
    let y = cy + p.y * scale * scatter;

    particles.push(new Particle(
      Math.random() * W,
      Math.random() * H,
      x, y
    ));
  }
}

function createStars() {
  stars = [];
  for (let i = 0; i < 90; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.random() * 1.7 + .3,
      phase: Math.random() * 10
    });
  }
}

function animate() {
  ctx.fillStyle = "rgba(2,4,18,0.25)";
  ctx.fillRect(0, 0, W, H);
  time++;

  for (let s of stars) {
    let a = .2 + .6 *
      Math.abs(Math.sin(time * .01 + s.phase));

    ctx.beginPath();
    ctx.fillStyle = `rgba(75,150,255,${a})`;
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#1976ff";
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fill();
  }

  const pulse = 1 + Math.sin(time * .035) * .025;
  const cx = W / 2, cy = H * .44;

  for (let p of particles) {
    p.update();

    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(pulse, pulse);
    ctx.translate(-cx, -cy);
    p.draw();
    ctx.restore();
  }

  ctx.shadowBlur = 0;
  requestAnimationFrame(animate);
}

canvas.addEventListener("click", e => {
  for (let i = 0; i < 35; i++) {
    const t = Math.random() * Math.PI * 2;
    const p = heart(t);
    const scale = Math.min(W/45, H/42, 13);

    particles.push(new Particle(
      e.clientX, e.clientY,
      W/2 + p.x*scale,
      H*.44 + p.y*scale
    ));
  }

  if (particles.length > 450)
    particles.splice(0, 35);
});

window.addEventListener("resize", resize);
resize();
animate();
</script>
</body>
</html>
